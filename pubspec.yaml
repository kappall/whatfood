name: whatfood
description: ""

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  uuid: ^4.5.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  google_mlkit_barcode_scanning: ^0.13.0
  camera: ^0.10.6
  http: ^1.2.2
  google_mlkit_commons: ^0.9.0
  path: ^1.9.0
  permission_handler: ^11.3.1
  flutter_riverpod: ^2.6.1
  fpdart: ^1.1.1
  file_picker: ^9.0.0
  routemaster: ^1.0.1
  rxdart: ^0.28.0
  shared_preferences: ^2.5.1
  dotted_border: ^2.1.0
  image: ^4.5.2
  font_awesome_flutter: ^10.8.0
  amplify_flutter: ^2.6.1
  amplify_auth_cognito: ^2.6.1
  amplify_storage_s3: ^2.6.1
  amplify_analytics_pinpoint: ^2.6.1
  amplify_datastore: ^2.6.1
  amplify_api: ^2.6.1
  dotenv: ^4.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^7.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  fl_chart: ^1.0.0
  url_launcher: ^6.3.2
  flutter_radar_chart: ^0.2.1
  flutter_heatmap_calendar: ^1.0.5

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/logo_green.png"
dev_dependencies:
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.3
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/logo_green.png
    - assets/icons/google.png
    - assets/icons/apple.png
    - assets/profile.jpg
    - assets/images/google.png
    - assets/images/onboarding1.png
    - assets/images/onboarding2.png
    - assets/images/onboarding3.png
    - assets/images/onboarding4.png
flutter_launcher_icons:
  ios: true
  remove_apha_ios: true
  android: "launcher_icon"
  image_path: "assets/icons/logo_green.png"
  min_sdk_android: 26

  # per android
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/logo_green.png"
  
