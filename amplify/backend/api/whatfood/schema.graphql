
type User @model @auth(rules: [{ allow: public, operations: [read,create,delete,update] }]){
  id: String!
  name: String!
  profilePic: String
  banner: String!
  preferences: [String]!
  allergies: [String]!
  goals: [String]!
  dislikes: [String]!
  dailyIntake: Int!
  email: String!
  isOnboarded: Boolean!
}


enum MealType {
  BREAKFAST
  LUNCH
  DINNER
  SNACK
}

type Post @model @auth(rules: [{ allow: public, operations: [read,create,delete,update] }]){
  id: ID!
  authorname: String!
  uid: String!
  authorImage: String!
  title: String!
  content: String
  upVotes: [String]!
  downVotes: [String]!
  createdAt: AWSDateTime!
  commentCount: Int!
  imageUrl: String
  tags: [String]!
}

type Comment @model @auth(rules: [{ allow: public, operations: [read,create,delete,update] }]){
  id: ID!
  text: String!
  likes: [String]!
  username: String!
  uid: String!
  postID: String!
  userImage: String
  createdAt: AWSDateTime!

}

type Recipe @model @auth(rules: [{ allow: public, operations: [read,create,delete,update] }]){
  id: ID!
  title: String!
  coverImage: String!
  description: String!
  ingredients: [String]!
  instructions: [String]!
  servings: String!
  cookTimeMinutes: String!
  createdAt: AWSDateTime!
  likes: [String]!
  uid: String!
  userImage: String
  username: String!
}

type Ingredient
  @model
  @auth(rules: [{ allow: public, operations: [read, create, delete, update] }]) {
  id: ID!
  name: String!
  coverImage: String
  description: String
  healthScore: Float
  nutriscoreGrade: String
  novaGroup: Int
  nutritionPer100g: AWSJSON
  similars: [String]!
  tips: [String]!
  shops: [String]!
  recipes: [String]!
  likes: [String]!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Report @model @auth(rules: [{ allow: public, operations: [read,create,delete,update] }]){
id: ID!
uid: String!
nutritionalValues: AWSJSON!
description: String!
category: String!
createdAt: AWSDateTime!
}
