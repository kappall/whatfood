
type User @model {
  id: ID!
  name: String!
  profilePic: String!
  banner: String!
  uid: String!
  preferences: [String]!
  savedPosts: [String]!
  bio: String
  postsCount: Int!
  dailyIntake: Int!
  followers: [String]!
  following: [String]!
  email: String!
  isVerified: Boolean!
}


enum MealType {
  BREAKFAST
  LUNCH
  DINNER
  SNACK
}

type Post @model {
  id: ID!
  description: String!
  likes: [String]!
  username: String!
  uid: String!
  userImage: String!
  type: String!
  createdAt: AWSDateTime!
  commentCount: Int!
  imageUrl: String!
  tags: [String]!
  mealType: MealType!

}

type Comment @model {
  id: ID!
  text: String!
  likes: [String]!
  username: String!
  uid: String!
  postID: String!
  userImage: String!
  createdAt: AWSDateTime!

}

type Recipe @model {
  id: ID!
  title: String!
  coverImage: String!
  description: String!
  ingredients: [String]!
  instructions: [String]!
  servings: String!
  cookTimeMinutes: String!
  createdAt: AWSDateTime!
  likes: [String]!
  uid: String!
  userImage: String!
  username: String!
}

type Report @model {
  id: ID!
  uid: String!
  date: AWSDateTime!
  nutritionalValues: AWSJSON!
  description: String!
  category: String!
}
